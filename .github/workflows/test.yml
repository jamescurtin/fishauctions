name: Test
on:
  push:
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint (ruff via pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  django-tests:
    name: Django tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./.github/scripts/prepare-ci.sh
      - run: docker compose -f docker-compose.yaml -f docker-compose.ci.yaml --profile ci build test db

      - name: Run Django tests in parallel with coverage
        # chmod 777 lets the container's `app` user (uid 1000) write reports
        # into the bind mount; same trick as prepare-ci.sh's logs/ dir.
        run: |
          mkdir -p coverage-out && chmod 777 coverage-out
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml --profile ci run --rm test bash .github/scripts/run-django-tests.sh

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-xml
          path: coverage-out/coverage.xml
          if-no-files-found: ignore

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: coverage-out/htmlcov/
          if-no-files-found: ignore

      - name: Print service logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml ps -a || true
          echo "=== db logs ==="
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml logs db || true
          echo "=== test logs ==="
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml logs test || true

      - run: docker compose -f docker-compose.yaml -f docker-compose.ci.yaml down
        if: always()

  selenium-tests:
    name: Selenium browser tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: ./.github/scripts/prepare-ci.sh
      - name: Build containers
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yaml --profile selenium build
      - name: Start all services and wait for health
        # `--wait` honors the db, web (Dockerfile HEALTHCHECK), and selenium
        # healthchecks. Replaces the prior hand-rolled polling loops.
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yaml --profile selenium up -d --wait --wait-timeout 240
      - name: Run Selenium tests
        # `web` is built from the `test` target via the CI overlay, so selenium
        # is already installed — no runtime pip install needed.
        run: docker exec django python3 manage.py test auctions.tests_selenium --tag=selenium -v 2
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Database logs ==="
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml logs db
          echo "=== Web logs ==="
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml logs web
          echo "=== Selenium logs ==="
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml logs selenium
          echo "=== Container status ==="
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml ps -a
